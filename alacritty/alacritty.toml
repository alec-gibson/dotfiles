
[colors.primary]
background = "#172126"
foreground = "#ebdbb2"

[colors.bright]
black = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#ebdbb2"
yellow = "#fabd2f"

[colors.normal]
black = "#282828"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
magenta = "#b16286"
red = "#cc241d"
white = "#a89984"
yellow = "#d79921"

[cursor]
unfocused_hollow = true

[env]
TERM = "xterm-256color"

[font]
size = 7

[font.normal]
family = "mono"

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[window.padding]
x = 2
y = 2

[general]
live_config_reload = true
